name: Mobile

on:
  push:
    paths: ['mobile/**', 'frontend/src/types/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'frontend/src/types/**', '.github/workflows/mobile.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npx expo install --check
      - run: npm run export
